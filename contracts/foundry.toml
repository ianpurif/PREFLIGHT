[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 512 }
invariant = { runs = 128, depth = 64 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
